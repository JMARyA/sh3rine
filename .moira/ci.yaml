name: ci

trigger:
  on_push:
    branches: [main]
  on_pr:
    target: [main]

vars:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always

steps:
  - name: check
    env: .moira/envs/rust.nix
    network: true
    run: cargo check --workspace

  - name: test
    env: .moira/envs/rust.nix
    run: cargo test --workspace
    network: true
    depends_on: [check]
