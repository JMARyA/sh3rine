name: publish

trigger:
  on_push:
    branches: [main]
  manual: true

# k0 is amd64, and packages.dockerImage builds for the agent's own system.
agent:
  labels:
    system: x86_64-linux

needs_flake:
  - packages.dockerImage

steps:
  - name: push-image
    env: .moira/envs/publish.nix
    run: |
      skopeo copy --policy .containers-policy.json \
        --dest-creds "$REGISTRY_USER:$REGISTRY_PASS" \
        docker-archive:${{ flake.packages.dockerImage }} \
        docker://git.hydrar.de/jmarya/sh3rine:latest
    network: true
    secrets:
      - REGISTRY_USER
      - REGISTRY_PASS
    timeout: 10m
